{% extends "base.html" %}
{% block title %}Choose organization{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="page-header text-center">
      <h1 class="h2">Choose organization</h1>
      <p class="text-muted">Select which store you are working in.</p>
    </div>
    <div class="list-group">
      {% for org in organizations %}
      <a href="{% url 'users:switch_organization' org.slug %}" class="list-group-item list-group-item-action">
        {{ org.name }}
      </a>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
