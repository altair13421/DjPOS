{# templates/sync/setup.html — till's first-run screen #}
<!doctype html>
<html>

<body style="font-family:sans-serif;max-width:28rem;margin:5rem auto">
    <h1>Set up this till</h1>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
    <form method="post">{% csrf_token %}
        <label>Central server
            <input name="central_url" value="https://your-app.onrender.com" style="width:100%">
        </label>
        <label>Pairing code
            <input name="code" placeholder="e.g. 3FA9C21B" style="width:100%;font-size:1.5rem" autofocus>
        </label>
        <button style="margin-top:1rem">Pair this till</button>
    </form>
    <p>Get a code from <b>Terminals</b> on the central dashboard.</p>
</body>

</html>
