[project]
name = "djpos"
version = "0.1.0"
description = "Django-based open-source Point of Sale with inventory and REST APIs"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "psycopg2-binary>=2.9",
    "gunicorn",
    "icecream>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
