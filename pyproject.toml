[project]
name = "ospos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Faez Akhtar", email = "faezakhtar110@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.11.1",
    "asttokens==3.0.1",
    "colorama==0.4.6",
    "django==5.2.14",
    "djangorestframework==3.17.1",
    "executing==2.2.1",
    "gunicorn==26.0.0",
    "icecream==2.2.0",
    "iniconfig==2.3.0",
    "packaging==26.2",
    "pluggy==1.6.0",
    "psycopg2-binary==2.9.12",
    "pygments==2.20.0",
    "pytest==9.0.3",
    "pytest-django==4.12.0",
    "sqlparse==0.5.5",
]

[dependency-groups]
dev = ["poethepoet"]

[tool.poe.tasks]
server = "python manage.py runserver"
makemigrations = "python manage.py makemigrations"
migrate = "python manage.py migrate"
